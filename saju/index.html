<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무료사주보기</title>
<meta name="description" content="KASI 만세력과 지역별 진태양시 보정으로 계산하는 무료 사주·궁합 풀이. 재물운·연애운·결혼운·직장운·건강운을 바로 확인하세요.">
<style>
:root{
  --navy:#16224D; --navy2:#24418f; --gold:#C9A227; --gold2:#8a6f14;
  --ink:#1a1a1a; --sub:#5b6472; --line:#d9dee7; --bg:#f4f6fa;
  --mok:#2e8b57; --hwa:#c0392b; --to:#b8860b; --geum:#7f8c8d; --su:#2c6fbb;
}
*{box-sizing:border-box}
body{margin:0;font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{display:grid;grid-template-columns:370px 1fr;min-height:100vh}
.panel{background:#fff;border-right:1px solid var(--line);padding:18px;overflow-y:auto;max-height:100vh}
.panel h1{font-size:19px;margin:0 0 3px;color:var(--navy);letter-spacing:.02em}
.panel .sub{font-size:11px;color:var(--sub);margin-bottom:14px;line-height:1.6}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;margin:0 0 12px}
legend{font-size:12px;font-weight:700;color:var(--navy);padding:0 5px}
label{display:block;font-size:11px;color:var(--sub);margin:8px 0 3px}
input,select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:5px;font-size:14px;font-family:inherit;background:#fff}
input:disabled{background:#f1f3f7;color:#aab}
.row{display:flex;gap:6px}.row>*{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub);margin-top:7px}
.chk input{width:auto;margin:0}
.chk.off{opacity:.45}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;margin:0;border:0;border-radius:0;background:#fff;color:var(--sub);font-weight:700;padding:7px 4px;font-size:12px}
.seg button.on{background:var(--navy);color:#fff}
button{width:100%;padding:10px;border:0;border-radius:6px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit}
button:hover{filter:brightness(1.12)}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.gold{background:var(--gold);color:#332800}
.note{font-size:10.5px;color:var(--sub);line-height:1.6;margin-top:6px}
.note a{color:var(--navy2)}
.tabs{display:flex;gap:5px;margin:0 0 12px}
.tab{flex:1;margin:0;padding:10px 4px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--sub);font-size:13px;font-weight:800}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.chips button{margin:0;padding:10px 2px;font-size:12.5px;background:#fff;color:var(--navy);border:1px solid #c7cfde}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips button.wide{grid-column:span 3;background:var(--gold);color:#332800;border-color:var(--gold);font-size:13.5px}
.chips button.wide.on{background:#a8871d;color:#fff}
.chips.rel{grid-template-columns:repeat(4,1fr)}
.err{display:none;font-size:11.5px;color:#b03030;background:#fbecec;border-radius:6px;padding:8px 10px;margin-top:8px;line-height:1.6}
.stage{padding:22px;overflow-y:auto;max-height:100vh}
.empty{color:var(--sub);text-align:center;padding-top:110px;font-size:13px;line-height:2}
.empty b{color:var(--navy)}

/* ── 리포트 ── */
.page{width:210mm;min-height:297mm;background:#fff;margin:0 auto 18px;padding:16mm 15mm;box-shadow:0 2px 14px rgba(0,0,0,.13);position:relative}
.page.flow{min-height:0}
.page.flow .pfoot{position:static;margin-top:16px}
.cover{background:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.cover h1{font-size:34px;margin:0 0 8px;letter-spacing:.05em}
.cover .who{font-size:19px;margin:20px 0 4px;color:var(--gold);font-weight:700}
.cover .meta{font-size:12px;opacity:.72;line-height:1.9}
.cover .foot{position:absolute;bottom:18mm;font-size:10px;opacity:.5;letter-spacing:.1em}
h2.sec{font-size:15px;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:5px;margin:0 0 12px;letter-spacing:.02em}
h3.sub{font-size:12px;color:var(--sub);margin:16px 0 7px;font-weight:700}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pil{border:1px solid var(--line);border-radius:8px;text-align:center;padding:9px 4px;background:#fbfcfe}
.pil .lab{font-size:10px;color:var(--sub);margin-bottom:5px}
.pil .han{font-size:27px;font-weight:800;line-height:1.15}
.pil .kr{font-size:11px;color:var(--sub);margin-top:3px}
.pil .god{font-size:9px;color:#fff;background:var(--navy);border-radius:9px;padding:1px 6px;display:inline-block;margin-top:5px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 0}
.badge{border:1px solid var(--navy);border-radius:6px;padding:6px 11px;font-size:11px}
.badge b{color:var(--navy);font-size:13px;margin-left:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fbfcfe}
.kv{font-size:11px;line-height:1.85;color:#333}
.kv b{color:var(--navy);display:inline-block;min-width:88px}
.body{font-size:13px;line-height:1.95;text-align:justify}
.body p{margin:0 0 9px}
.body strong{color:var(--navy)}
.body ul{margin:0 0 9px;padding-left:18px}
.chapter{margin:0 0 22px}
.chapter .ttl{display:flex;align-items:center;gap:9px;margin:0 0 9px}
.chapter .num{width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.chapter .tx{font-size:14.5px;font-weight:800;color:var(--navy)}
.tone{display:inline-block;font-size:11px;font-weight:800;border-radius:10px;padding:2px 9px;margin-right:6px;vertical-align:1px}
.t2{background:#e3f5ea;color:#1f7a4d}.t1{background:#eaf4ec;color:#2f7a4d}.t0{background:#eef0f4;color:#5b6472}.tm1{background:#fdf3dc;color:#8a6f14}.tm2{background:#fbecec;color:#a33}
.pfoot{position:absolute;bottom:9mm;left:15mm;right:15mm;display:flex;justify-content:space-between;font-size:9px;color:#98a1ae;border-top:1px solid #eceff4;padding-top:5px}
.disc{font-size:10.5px;color:var(--sub);line-height:1.8;border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:#fbfcfe;margin-top:10px}
.gauge{height:12px;border-radius:6px;background:linear-gradient(90deg,#d9534f,#e8b84a 45%,#5bb27a);position:relative;margin:8px 0 4px}
.gauge i{position:absolute;top:-5px;width:4px;height:22px;background:var(--navy);border-radius:2px}
.gl{display:flex;justify-content:space-between;font-size:9.5px;color:#98a1ae}

@media (max-width:880px){
  .wrap{grid-template-columns:1fr}
  .panel{max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .stage{max-height:none;padding:10px;overflow:visible}
  .page{width:100%;min-height:0;padding:22px 16px}
  .cover{min-height:60vh}
  .cover .foot{position:static;margin-top:28px}
  .pfoot{position:static;margin-top:16px}
  .pil .han{font-size:22px}
  .grid2{grid-template-columns:1fr}
  .empty{padding-top:30px}
}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .panel{display:none}
  .wrap{display:block}
  .stage{padding:0;max-height:none;overflow:visible}
  .page{box-shadow:none;margin:0;page-break-after:always;width:210mm;min-height:297mm;height:auto;padding:16mm 15mm}
  .page.flow{min-height:0;padding-bottom:20mm}
  .cover{min-height:297mm}
  .cover .foot{position:absolute}
  .chapter .ttl{page-break-after:avoid;break-after:avoid}
  .body p{orphans:2;widows:2}
  .card{page-break-inside:avoid}
  .page:last-child{page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<!-- ▼ 블로그 임베드판 (2026-11-03) : 블로그 칸 안에서 열릴 때만 적용. 단독으로 열면 기존과 동일 -->
<script>if(window.self!==window.top)document.documentElement.classList.add('emb');</script>
<style>
@media screen{
html.emb{--paper:#f7f5f0;--card:#fff;--edge:#e7e2d6;--ink2:#2b2f38}
html.emb body{background:var(--paper)}
html.emb .wrap{display:block;min-height:0}
html.emb .panel{max-height:none;overflow:visible;border:0;background:transparent;padding:18px 14px 6px}
html.emb .panel h1{font-size:24px;text-align:center;letter-spacing:.08em;margin:6px 0 4px}
html.emb .panel h1::before{content:"LIA명리학연구소";display:block;font-size:10.5px;letter-spacing:.32em;color:var(--gold2);font-weight:700;margin-bottom:6px}
html.emb .panel .sub{text-align:center;font-size:11.5px;margin-bottom:16px}
html.emb .tabs{background:#ebe7dc;border-radius:999px;padding:4px;gap:4px;max-width:420px;margin:0 auto 14px}
html.emb .tab{border:0;border-radius:999px;background:transparent;padding:9px 4px}
html.emb .tab.on{background:var(--navy);box-shadow:0 2px 8px rgba(22,34,77,.25)}
html.emb fieldset{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px 14px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
html.emb legend{background:var(--navy);color:#fff;border-radius:999px;padding:3px 11px;font-size:11px}
html.emb input,html.emb select{border-color:var(--edge);border-radius:9px;padding:9px 10px;font-size:15px;background:#fffefb}
html.emb .seg{border-color:var(--edge);border-radius:9px}
html.emb .chips{gap:7px}
html.emb .chips button{border-radius:999px;border-color:var(--edge);padding:11px 2px;font-size:13px}
html.emb .chips button.wide{border-radius:12px;padding:14px 2px;font-size:15px;box-shadow:0 3px 10px rgba(201,162,39,.35)}
html.emb button.ghost{border-radius:12px;background:transparent}
html.emb .stage{max-height:none;overflow:visible;padding:8px 10px 16px}
html.emb .empty{padding:26px 10px;background:var(--card);border:1px dashed var(--edge);border-radius:14px}
html.emb .page{width:100%;min-height:0;padding:24px 18px;border-radius:16px;border:1px solid var(--edge);box-shadow:0 2px 10px rgba(0,0,0,.05);margin:0 auto 14px}
html.emb .page.flow .pfoot,html.emb .pfoot{position:static;margin-top:16px}
html.emb .cover{min-height:0;padding:46px 18px;background:linear-gradient(160deg,#16224D 0%,#24418f 100%)}
html.emb .cover h1{font-size:27px}
html.emb .cover .foot{position:static;margin-top:26px}
html.emb h2.sec{border-bottom:0;font-size:16px;padding-bottom:0;margin-bottom:14px}
html.emb h2.sec::after{content:"";display:block;width:36px;height:3px;border-radius:2px;background:var(--gold);margin-top:7px}
html.emb .pillars{gap:7px}
html.emb .pil{background:#fff;border:1px solid var(--edge);border-radius:12px;padding:11px 3px 10px}
html.emb .pil .han{font-size:29px;letter-spacing:.02em}
html.emb .pil .god{background:var(--gold);color:#332800;font-weight:700}
html.emb .badge{border-radius:999px;border-color:var(--edge);background:#fff}
html.emb .card,html.emb .disc{background:#fffefb;border-color:var(--edge);border-radius:12px}
html.emb .grid2{grid-template-columns:1fr}
html.emb .card svg{display:block;max-width:440px;margin:0 auto}
html.emb .body{font-size:14.5px;line-height:2;color:var(--ink2)}
html.emb .chapter .tx{font-size:15.5px}
html.emb .e-m{color:#2e8b57}html.emb .e-h{color:#c0392b}html.emb .e-t{color:#b8860b}html.emb .e-g{color:#6f7b85}html.emb .e-s{color:#2c6fbb}
}
@media screen and (max-width:420px){html.emb .pil .han{font-size:24px}html.emb .chips button{font-size:12px}}
</style>
<!-- ▲ 블로그 임베드판 머리 -->
</head>
<body>
<div class="wrap">
<div class="panel">
  <h1>무료사주보기</h1>
  <div class="sub">KASI 만세력 · 지역별 진태양시 보정 · LIA명리학연구소 판정 엔진<br>입력한 정보는 이 화면 밖으로 전송되지 않습니다.</div>

  <div class="tabs">
    <button class="tab on" id="tabSaju" onclick="switchTab('saju')">사주보기</button>
    <button class="tab" id="tabGung" onclick="switchTab('gung')">궁합보기</button>
  </div>

  <div id="paneSaju">
    <fieldset><legend>내 정보</legend><div id="formA"></div></fieldset>
    <fieldset>
      <legend>보고 싶은 운 — 누르면 바로 풀이합니다</legend>
      <div class="chips" id="topicChips"></div>
      <div class="err" id="errSaju"></div>
    </fieldset>
    <button class="ghost" onclick="savePdf()">PDF로 저장</button>
    <div class="note">인쇄 창에서 대상을 <b>PDF로 저장</b>, 여백 <b>없음</b>, 배경 그래픽 <b>체크</b>.</div>
  </div>

  <div id="paneGung" style="display:none">
    <fieldset><legend>나</legend><div id="formG1"></div></fieldset>
    <fieldset><legend>상대</legend><div id="formG2"></div></fieldset>
    <fieldset>
      <legend>두 사람의 관계</legend>
      <div class="chips rel" id="relChips"></div>
    </fieldset>
    <button class="gold" onclick="runGung()">궁합보기</button>
    <div class="err" id="errGung"></div>
    <button class="ghost" onclick="savePdf()">PDF로 저장</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="empty">생년월일시와 태어난 지역을 넣고<br><b>보고 싶은 운</b>을 누르면 바로 아래에 풀이가 나옵니다.<br>궁합은 위의 <b>궁합보기</b> 탭에서 두 사람을 넣으십시오.</div>
</div>

 틈을 찾아 끝내 원하는 곳에 닿으십니다. 부드러워 보여도 쉽게 꺾이지 않는 질긴 사람입니다.","다만 기댈 곳을 찾는 습성이 있어, 누구 곁에 있느냐가 삶의 방향을 크게 바꿉니다."],"丙":["구름 한 점 없는 하늘의 한낮 태양을 떠올려 보십시오.","숨기는 것이 적고 있는 그대로 드러내며 주변을 밝히십니다. 당신이 들어오면 분위기가 바뀐다는 말을 자주 들으셨을 것입니다.","다만 태양은 모든 곳을 비추느라 정작 자기 그림자는 보지 못합니다. 지칠 때 지쳤다고 말하는 연습이 필요합니다."],"丁":["어두운 방 한쪽을 오래 밝히는 등불을 떠올려 보십시오.","넓게 비추기보다 한 사람, 한 가지 일을 깊이 밝히십니다. 겉으로 드러내지 않는 속정이 깊어 가까운 사람일수록 당신을 오래 기억합니다.","다만 바람에 흔들리는 불꽃처럼 감정의 기복이 안에서 크게 일어납니다. 흔들려도 꺼지지 않는다는 것을 스스로 믿어 주십시오."],"戊":["넓은 들판 끝에 묵직하게 버티고 선 산을 떠올려 보십시오.","쉽게 흔들리지 않고 많은 사람을 품는 그릇이 크십니다. 일이 터지면 사람들이 당신 쪽을 먼저 봅니다.","다만 산은 움직이기까지 시간이 걸립니다. 변화가 필요할 때 너무 오래 버티지 않는 것이 숙제입니다."],"己":["씨앗을 품고 계절을 기다리는 밭을 떠올려 보십시오.","사람과 일을 가꾸어 결실로 만드는 힘이 있으십니다. 실속을 챙기고 꼼꼼히 따져, 남들이 흘린 것을 거두어 냅니다.","다만 모든 것을 품으려다 정작 자기 마음은 뒷전이 되기 쉽습니다. 내 밭부터 돌보는 것이 결국 모두를 위한 길입니다."],"庚":["산에서 막 캐낸 단단한 무쇠를 떠올려 보십시오.","결단이 빠르고 의리를 중시하십니다. 할 말은 하고, 맺고 끊음이 분명해 함께 일하면 믿음직합니다.","다만 다듬어지기 전의 쇠는 무겁습니다. 부딪히는 순간 상대가 받는 무게를 한 번쯤 헤아려 보시면 더 큰 사람이 됩니다."],"辛":["빛을 받아 반짝이는 잘 다듬어진 보석을 떠올려 보십시오.","감각이 예민하고 완성도에 대한 기준이 높으십니다. 남들이 지나치는 작은 흠이 당신 눈에는 보입니다.","다만 보석은 흠집에 민감합니다. 자존심이 다칠 때 말없이 멀어지기보다, 무엇이 아팠는지 말하는 편이 관계를 지킵니다."],"壬":["여러 물줄기를 받아 넓게 흐르는 큰 강을 떠올려 보십시오.","생각의 폭이 넓고 흐름을 크게 읽으십니다. 한곳에 머무르기보다 움직이며 길을 여는 사람입니다.","다만 큰 물은 둑이 없으면 넘칩니다. 하고 싶은 것이 많을수록 지켜야 할 경계를 먼저 정해 두시면 좋습니다."],"癸":["새벽 들판을 조용히 적시는 이슬과 빗물을 떠올려 보십시오.","드러나지 않게 스며들어 바꾸는 힘이 있으십니다. 직관이 뛰어나 남이 말하지 않은 속마음까지 읽어 냅니다.","다만 스며드는 물은 자기 모양을 잃기 쉽습니다. 남의 마음을 읽는 만큼 내 마음도 소리 내어 말해 주십시오."]},STR_IMG={"木":["게다가 이 나무는 이미 숲을 이룰 만큼 기운이 두텁습니다.","그리고 이 나무는 아직 바람 앞의 묘목처럼 여립니다."],"火":["게다가 이 불은 한여름처럼 기운이 넘칩니다.","그리고 이 불은 바람 앞에서 조심스레 타는 불씨처럼 여립니다."],"土":["게다가 이 땅은 겹겹이 쌓여 단단합니다.","그리고 이 땅은 물기를 머금어 아직 무른 편입니다."],"金":["게다가 이 쇠는 이미 단단히 벼려져 있습니다.","그리고 이 쇠는 아직 제련 중이라 여린 편입니다."],"水":["게다가 이 물은 장마철 강처럼 불어나 있습니다.","그리고 이 물은 마른 땅의 샘물처럼 귀합니다."]},VOICE={"비겁":'"내 방식대로 하겠다"',"식상":'"지금 말해야 한다, 지금 만들어야 한다"',"재성":'"그래서 남는 게 뭔데"',"관성":'"책임질 수 있는 만큼만 하자"',"인성":'"한 번만 더 생각해 보자"'},G_ORDER=["비겁","식상","재성","관성","인성"];function grpRel(n,e){const s=G_ORDER.indexOf(n),t=G_ORDER.indexOf(e);return(s+1)%5===t?"gen":(t+1)%5===s?"genby":(s+2)%5===t?"ctl":"ctlby"}const CARRY={E:["식신","상관","비견","겁재"],I:["정인","편인","정관","편관"],N:["편인","상관","편재"],S:["정인","정재","정관"],T:["편관","정관","편재","정재"],F:["식신","정인","편인"],J:["정관","정재","정인"],P:["상관","편재","편인"]},CLABEL={E:"밖으로 드러내는 기운(식상·비겁)",I:"안으로 다지는 기운(인성·관성)",N:"남다른 시선의 기운(편인·상관·편재)",S:"차곡차곡 쌓는 기운(정인·정재·정관)",T:"판단과 계산의 기운(관성·재성)",F:"돌보고 품는 기운(식신·인성)",J:"반듯한 기운(정관·정재·정인)",P:"틀을 넘는 기운(상관·편재·편인)"},jp=(n,e)=>{const s=n.indexOf("(");if(s<0)return J[e](n);const t=J[e](n.slice(0,s));return t.slice(0,s)+n.slice(s)+t.slice(s)},OPPL={E:"I",I:"E",N:"S",S:"N",T:"F",F:"T",J:"P",P:"J"},AXIS_NAME={E:"에너지의 방향",I:"에너지의 방향",N:"세상을 보는 눈",S:"세상을 보는 눈",T:"결정하는 방식",F:"결정하는 방식",J:"삶을 꾸리는 방식",P:"삶을 꾸리는 방식"},FRAME_TAG={"받침":"t2","깨움":"t1","보완":"t0","누름":"tm1"},FRAME_TXT={E:{"받침":["사람 속에서 힘을 얻는 E 성향이 이 기운과 같은 방향으로 흐릅니다. 명식과 성향이 서로 맞물려 힘이 배가됩니다.",'그래서 모임에서 먼저 말을 꺼내고, 분위기가 처지면 자연스럽게 판을 살리는 사람으로 보이십니다. 애쓴 적이 없는데 주변에서는 "에너지가 좋다"는 말을 자주 합니다.'],"깨움":["명식 안에서 드러내는 기운은 크지 않은데, E 성향이 그 잠들어 있던 부분을 흔들어 깨웁니다. 평소 잘 나오지 않던 것이 사람을 만나면 자연스럽게 나옵니다.","그래서 혼자 있을 때와 사람들 속에 있을 때의 모습이 꽤 다릅니다. 막상 나가면 누구보다 잘 어울리지만, 돌아와서는 조용히 정리하는 시간이 꼭 필요하십니다."],"보완":["명식에는 밖으로 드러내는 기운이 거의 없습니다. 그 빈 곳을 E 성향이 대신 채워 줍니다. 명식이 채우지 못하는 것을 성향이 메우는 셈입니다.","그래서 사람들은 외향적인 사람으로 기억하지만, 그 사교성은 타고났다기보다 살면서 스스로 길러 온 힘입니다. 많이 쓰면 남보다 빨리 지치니, 충전 시간을 일정에 미리 넣어 두십시오."],"누름":["명식은 안으로 다지는 기운이 두텁습니다. 성향은 밖으로 나가 부딪히고 싶어 하는데, 명식은 한 번 더 생각하고 움직이라고 이릅니다. 성향은 좋으나 명식이 겸허히 받으라 하는 구조입니다.","그래서 먼저 나서 놓고 뒤에서 혼자 곱씹는 일이 잦습니다. 두 힘은 싸우는 것이 아니라 서로가 필요합니다. 나서는 힘이 기회를 만들고, 곱씹는 힘이 실수를 걸러 냅니다."]},I:{"받침":["혼자 정리할 시간이 있어야 힘이 나는 I 성향이 안으로 다지는 명식과 같은 방향입니다. 명식과 성향이 맞물려 생각의 깊이가 배가됩니다.",'그래서 말수가 적어 보여도 입을 열면 핵심을 찌르는 사람으로 통하십니다. 회의가 끝난 뒤 "그때 그 말이 맞았다"는 이야기를 자주 듣습니다.'],"깨움":["명식에서 안으로 다지는 기운은 여린 편인데, I 성향이 그 부분을 깨워 줍니다. 평소 잘 쓰지 않던 사색의 힘이 혼자 있을 때 자연스럽게 나옵니다.","그래서 밖에서는 활발해 보이다가도, 중요한 결정 앞에서는 혼자 들어가 생각을 마치고 나오십니다. 그 짧은 고요가 결과를 바꿉니다."],"보완":["명식에는 안으로 다지는 기운이 거의 없습니다. 그 빈 곳을 I 성향이 대신 채워, 들뜨기 쉬운 명식에 무게중심을 잡아 줍니다.",'그래서 가까운 사람은 "생각보다 신중하다"고 말합니다. 그 신중함은 스스로 만든 안전장치입니다.'],"누름":["명식은 밖으로 드러내는 기운이 두터운데, 성향은 안쪽을 지키려 합니다. 표현하고 싶은 것이 많은 명식을 성향이 다잡고 있는 구조입니다.","그래서 속으로는 할 말이 많은데 꺼내지 않고 넘어가는 순간이 많습니다. 가끔은 마음껏 드러낼 장을 따로 만들어 두십시오. 쌓인 표현이 한꺼번에 터지는 것보다 훨씬 낫습니다."]},N:{"받침":["남들이 못 보는 가능성을 먼저 보는 N 성향이 남다른 시선의 명식과 맞물립니다. 아이디어가 아이디어를 부르는 구조입니다.",'그래서 대화가 자꾸 "만약에"로 흘러가고, 남들이 지금을 이야기할 때 혼자 3년 뒤를 이야기하고 계실 때가 많습니다.'],"깨움":["명식 속 남다른 시선은 조용히 숨어 있는데, N 성향이 그것을 깨웁니다. 평소 잘 드러나지 않던 발상이 자연스럽게 튀어나옵니다.",'그래서 평범해 보이다가도 어느 순간 "그 생각을 어떻게 했어?"라는 말을 듣게 하십니다.'],"보완":["명식에는 남다른 시선의 기운이 거의 없는 대신, N 성향이 그 빈 곳을 채웁니다. 현실을 다지는 명식에 큰 그림을 더해 주는 셈입니다.","그래서 꼼꼼하면서도 멀리 보는, 드문 조합의 사람으로 보이십니다."],"누름":["명식은 현실과 규칙을 차곡차곡 챙기는 쪽인데, 성향은 자꾸 큰 그림으로 날아가려 합니다. 명식이 발을 땅에 붙여 두라고 이르는 구조입니다.",'그래서 떠오른 생각을 바로 실행하지 못하고 "현실적으로 될까"를 몇 번씩 따지십니다. 그 따지는 과정이 아이디어를 쓸 만한 계획으로 바꿔 줍니다.']},S:{"받침":["눈앞의 사실과 경험을 믿는 S 성향이 차곡차곡 쌓는 명식과 겹칩니다. 한 번 익힌 것은 쉽게 잊지 않는 구조입니다.",'그래서 주변에서는 "저 사람한테 물어보면 정확하다"는 평을 듣고, 막연한 이야기보다 숫자와 사례로 말씀하십니다.'],"깨움":["명식에서 쌓는 기운은 크지 않은데, S 성향이 그 부분을 깨워 생활을 단단하게 만듭니다.","그래서 자유로워 보이면서도 해야 할 일은 빠뜨리지 않는 사람으로 보이십니다."],"보완":["명식은 생각이 앞서고 쌓는 기운이 비어 있는데, S 성향이 그 빈 곳을 메워 줍니다. 떠오른 생각이 현실에 내려앉도록 붙잡아 주는 셈입니다.","그래서 이상과 현실을 오가며 둘 다 놓치지 않으십니다."],"누름":["명식은 남다른 시선이 두터운데, 성향은 검증된 방식을 먼저 찾습니다. 명식 속의 엉뚱한 발상을 성향이 붙잡아 두는 구조입니다.",'그래서 좋은 아이디어가 있어도 "해 본 적 없는 방식"이라 미뤄 두실 때가 있습니다. 작게 시험해 보는 습관 하나가 그 발상을 살립니다.']},T:{"받침":["논리와 기준으로 판단하는 T 성향이 판단과 계산의 명식과 같은 방향입니다. 결정이 빠르고 흔들림이 적습니다.","그래서 문제가 생기면 감정보다 해결책부터 꺼내시고, 사람들은 위기 때 자연스럽게 당신을 찾습니다."],"깨움":["명식 속 판단의 기운은 조용한 편인데, T 성향이 그것을 깨워 기준을 세워 줍니다.","그래서 평소엔 무던하다가도 선을 넘는 일 앞에서는 단호해지십니다."],"보완":["명식에는 판단과 계산의 기운이 거의 없는데, T 성향이 그 빈 곳을 채워 줍니다. 정이 많은 명식에 기준을 세워 주는 셈입니다.","그래서 마음은 따뜻한데 일 처리는 냉정한, 믿을 만한 사람으로 보이십니다."],"누름":["명식은 돌보고 품는 기운이 두터운데, 성향은 논리로 잘라 내려 합니다. 명식이 사람을 먼저 보라고 이르는 구조입니다.","그래서 옳은 말을 해 놓고 상대 표정을 보며 마음이 쓰이는 일이 잦습니다. 결론은 T로 내리되, 전달은 명식이 가진 따뜻함으로 하시면 둘 다 살아납니다."]},F:{"받침":["사람의 마음을 먼저 보는 F 성향이 돌보고 품는 명식과 겹칩니다. 공감이 깊고 사람을 살리는 힘이 큽니다.","그래서 힘든 사람이 이상하게 당신에게 먼저 털어놓습니다."],"깨움":["명식 속 품는 기운은 여린 편인데, F 성향이 그것을 깨웁니다.","그래서 평소엔 무심해 보이다가도 가까운 사람의 일에는 누구보다 먼저 움직이십니다."],"보완":["명식에는 품는 기운이 거의 없는데, F 성향이 그 빈 곳을 채웁니다. 계산이 앞서는 명식에 온기를 더해 주는 셈입니다.","그래서 일은 똑 부러지게 하면서도 사람을 놓치지 않는 분으로 보이십니다."],"누름":["명식은 판단과 계산의 기운이 두터운데, 성향은 사람의 마음을 먼저 봅니다. 명식이 정에 끌려 결정을 미루지 말라고 이르는 구조입니다.","그래서 마음이 약해 들어준 부탁 때문에 나중에 손해를 보는 일이 생깁니다. 마음은 그대로 두되, 숫자와 기한만은 분명히 하십시오."]},J:{"받침":["계획과 마무리를 중시하는 J 성향이 반듯한 명식과 맞물립니다. 한 번 정한 일은 끝을 봅니다.","그래서 일정표가 늘 정리되어 있고, 약속을 어기는 사람을 유독 답답해하십니다."],"깨움":["명식 속 반듯한 기운은 조용한데, J 성향이 그것을 깨워 질서를 세웁니다.","그래서 자유로운 사람처럼 보이다가도 중요한 일은 철저히 준비해 오십니다."],"보완":["명식에는 반듯한 기운이 거의 없는데, J 성향이 그 빈 곳을 채웁니다. 흩어지기 쉬운 명식에 틀을 잡아 주는 셈입니다.","그래서 스스로 만든 규칙 덕분에 흔들리지 않으십니다. 다만 그 규칙이 무너지면 크게 흔들리니, 규칙을 너무 촘촘하게 짜지 않는 것이 요령입니다."],"누름":["명식은 틀을 넘는 기운이 두터운데, 성향은 계획 안에 모든 것을 넣으려 합니다. 명식이 계획 밖의 기회를 보라고 이르는 구조입니다.","그래서 계획대로 되지 않으면 스트레스를 받으면서도, 막상 계획 밖에서 좋은 일이 생기곤 합니다. 일정에 빈칸 하나를 남겨 두십시오."]},P:{"받침":["흐름에 맞춰 움직이는 P 성향이 틀을 넘는 명식과 겹칩니다. 변화가 생기면 오히려 살아나는 구조입니다.","그래서 갑작스러운 일정 변경에도 당황하지 않고, 남들이 막힐 때 우회로를 먼저 찾아내십니다."],"깨움":["명식 속 틀을 넘는 기운은 숨어 있는데, P 성향이 그것을 깨웁니다.","그래서 반듯해 보이다가도 결정적인 순간에는 의외의 선택을 하십니다."],"보완":["명식에는 틀을 넘는 기운이 거의 없는데, P 성향이 그 빈 곳을 채웁니다. 반듯한 명식에 숨 쉴 틈을 만들어 주는 셈입니다.","그래서 원칙은 지키되 융통성 있는 사람으로 보이십니다."],"누름":["명식은 반듯한 기운이 두터운데, 성향은 흐름대로 가고 싶어 합니다. 명식이 마감과 약속은 지키라고 이르는 구조입니다.","그래서 미뤄 두고 마지막에 몰아서 해내는 일이 많습니다. 결과는 나오지만 몸이 상하니, 중간 점검 날짜 하나만 정해 두십시오."]}};function carrySum(n,e){const s=n.godsCount||{};return CARRY[e].reduce((n,e)=>n+(s[e]||0),0)}function axisFrame(n,e){const s=carrySum(n,e),t=carrySum(n,OPPL[e]);let o;return o=0===s?t>=3?"누름":"보완":t>=s+2?"누름":s>=2&&s>=t?"받침":"깨움",{letter:e,c:s,o:t,f:o}}function validMbti(n){return n&&"모름"!==n&&4===n.length}function axisPara(n,e){const s=axisFrame(n,e),t=FRAME_TXT[e][s.f];return P(`<span class="tone ${FRAME_TAG[s.f]}">${s.f}</span><strong>${e} · ${AXIS_NAME[e]}</strong> — 명식에는 ${jp(CLABEL[e],"i")} ${s.c}개, 반대편인 ${jp(CLABEL[OPPL[e]],"i")} ${s.o}개 놓여 있습니다. ${t[0]} ${t[1]}`)}const YONG_AFF={"木":["N","E","P"],"火":["E","F","P"],"土":["S","J","F"],"金":["T","J","S"],"     try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    var go=function(){
      if(st.k==='gung'){
        if(window.switchTab)switchTab('gung');
        fillForm('G1',st.G1);fillForm('G2',st.G2);
        if(st.r){var rb=document.querySelector('#relChips button[data-r="'+st.r+'"]');if(rb)rb.click();}
        if(window.runGung)runGung();
      }else{
        fillForm('A',st.A);
        var tb=document.querySelector('#topicChips button[data-t="'+(st.t||'기본운')+'"]');
        if(tb)tb.click();else if(window.runSaju)runSaju(st.t||'기본운');
      }
      var css=document.createElement('style');
      css.textContent='#pdfBar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#16224D;color:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;box-shadow:0 -4px 14px rgba(0,0,0,.2);font-size:13px;line-height:1.5}#pdfBar button{width:auto;flex:0 0 auto;margin:0;background:#C9A227;color:#332800;padding:12px 18px;font-size:15px;border-radius:10px}#pdfBar span{flex:1}@media print{#pdfBar{display:none!important}}';
      document.head.appendChild(css);
      var ua=navigator.userAgent||'';
      var inapp=/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua);
      var bar=document.createElement('div');bar.id='pdfBar';
      bar.innerHTML='<span>'+(inapp?'이 앱 안에서는 PDF 저장이 안 될 수 있습니다. 오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>를 누른 뒤 저장하십시오.':'풀이가 준비됐습니다. 인쇄 창에서 <b>PDF로 저장</b>을 고르십시오.')+'</span><button type="button" id="pdfBarBtn">PDF로 저장</button>';
      document.body.appendChild(bar);document.body.style.paddingBottom='86px';
      g('pdfBarBtn').onclick=function(){if(window.savePdf)savePdf();};
    };
    if(document.readyState==='complete')setTimeout(go,50);else window.addEventListener('load',function(){setTimeout(go,50);});
    return;
  }

  /* ── 블로그 칸 안 ── */
  var E={'甲':'m','乙':'m','丙':'h','丁':'h','戊':'t','己':'t','庚':'g','辛':'g','壬':'s','癸':'s',
         '寅':'m','卯':'m','巳':'h','午':'h','辰':'t','戌':'t','丑':'t','未':'t','申':'g','酉':'g','亥':'s','子':'s'};
  function paint(){
    var hs=document.querySelectorAll('.pil .han');
    for(var i=0;i<hs.length;i++){
      var el=hs[i]; if(el.getAttribute('data-e'))continue;
      var t=el.textContent, out='';
      for(var j=0;j<t.length;j++){var c=t.charAt(j);out+=E[c]?'<span class="e-'+E[c]+'">'+c+'</span>':c;}
      el.innerHTML=out; el.setAttribute('data-e','1');
    }
  }
  var last=0;
  function send(){
    var w=document.querySelector('.wrap');
    var hh=Math.ceil(w?w.getBoundingClientRect().height:document.body.scrollHeight);
    if(Math.abs(hh-last)>2){last=hh;try{parent.postMessage({yjpj:'h',h:hh},'*');}catch(e){}}
  }
  var stg=document.getElementById('stage');
  if(stg&&window.MutationObserver)new MutationObserver(function(){paint();send();}).observe(stg,{childList:true,subtree:true});
  if(window.ResizeObserver){var w=document.querySelector('.wrap');if(w)new ResizeObserver(send).observe(w);}
  window.addEventListener('load',send);
  document.addEventListener('click',function(){setTimeout(send,60);setTimeout(send,400);},true);
  paint();send();

  /* PDF: 칸 안에서는 인쇄가 막히는 폰이 많아 새 탭(단독 화면)으로 넘겨서 저장 */
  window.savePdf=function(){
    if(!LAST||!document.querySelector('#stage .page')){
      var er=g(document.getElementById('paneGung').style.display==='none'?'errSaju':'errGung');
      if(er){er.textContent='먼저 보고 싶은 운을 눌러 풀이를 띄워 주십시오.';er.style.display='block';}
      return;
    }
    var st={k:LAST.k};
    if(LAST.k==='gung'){st.G1=readForm('G1');st.G2=readForm('G2');st.r=LAST.r;}else{st.A=readForm('A');st.t=LAST.t;}
    var url=location.href.split('#')[0]+'#r='+b64e(JSON.stringify(st));
    var win=null;try{win=window.open(url,'_blank');}catch(e){}
    if(!win){
      var box=g('pdfOpen');
      if(!box){box=document.createElement('div');box.id='pdfOpen';box.className='err';box.style.display='block';
        (document.getElementById('paneGung').style.display==='none'?g('paneSaju'):g('paneGung')).appendChild(box);}
      box.innerHTML='새 창이 막혔습니다. <a href="'+url+'" target="_blank" rel="noopener">여기를 눌러 새 창에서 열고</a> PDF로 저장하십시오.';
      box.style.display='block';send();
    }
  };
})();
</script>
